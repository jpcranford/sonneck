<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first so a browser that understands image/svg+xml (Chrome,
         Firefox) prefers it over the PNG below — Safari (iOS and macOS)
         doesn't render an SVG favicon in its tab bar at all, silently
         falling through to a blank/globe placeholder, so favicon-32x32.png
         (rasterized from favicon.svg via a headless-browser render, same
         near-black-badge design) is a real fallback for it, not a
         duplicate. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- use-credentials: a manifest is otherwise fetched without cookies,
         so behind an auth proxy (Cloudflare Access, Authelia…) it gets the
         proxy's login redirect instead and the installed app has no icon. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Matches --color-paper (see index.css's design tokens) so Safari's
         chrome (status bar / home-indicator area) blends into the page
         background instead of reading as a separate colored band —
         confirmed via live testing, 2026-08-22: the accent green this was
         previously set to created a visible seam against the app's
         actual off-white body. -->
    <meta name="theme-color" content="#f8f6f3" />
    <!-- Sets the light/dark theme before anything paints, from the choice
         lib/theme.ts saves (light, dark or system; system when there's
         none yet), so a dark page never flashes light first, plus the
         Dark Mode Scores flag. Mirrors lib/theme.ts's resolveTheme, its
         browser-bar colors and useDarkScoresSync. -->
    <script>
      try {
        var pref = localStorage.getItem('sonneck-theme') || 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#231e1a')
        if (localStorage.getItem('sonneck-dark-scores') === '1')
          document.documentElement.dataset.darkScores = ''
        // The macOS desktop app hides its title bar; mark it so the page
        // keeps the traffic lights band clear (lib/nativeTitleBar.ts).
        // Wails injects window.runtime ahead of this script.
        if (window.runtime && /Macintosh/.test(navigator.userAgent))
          document.documentElement.dataset.nativeTitlebar = ''
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonneck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
