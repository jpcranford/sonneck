# Builds and publishes Sonneck's Docker image to GHCR.
#
# Four triggers:
#
#   1. push to main       -> validation build only, no push. This is what
#                             keeps the README's "Build status" badge
#                             meaningful day to day, separate from actual
#                             releases.
#   2. nightly (schedule) -> :dev, rebuilt from the latest commit on main
#                             whose OWN push-triggered validation build (#1
#                             above) actually succeeded — not just whatever
#                             HEAD happens to be, which could be a commit
#                             whose validation run hasn't finished yet, or
#                             failed. Resolved via `gh run list` against
#                             this exact workflow file (push/main/success,
#                             newest first) in the "Resolve latest validated
#                             commit on main" step below, then checked out
#                             by that specific SHA rather than the
#                             schedule event's own (undefined-until-resolved)
#                             ref. Builds linux/amd64 and linux/arm64
#                             natively (CLAUDE.md > Docker/build — native
#                             runners, not QEMU emulation), merges into one
#                             multi-arch manifest, and points the floating
#                             :dev tag at it directly — a nightly build has
#                             no release version to also tag alongside it,
#                             unlike #3 below.
#   3. a release is published — action is either "released" (a real
#      release, or a pre-release converted to one) or "prereleased" (a new
#      pre-release). Both build linux/amd64 and linux/arm64 natively and
#      merge into one multi-arch manifest tagged with the release's own
#      version tag (e.g. v2.0.0-beta.1) — every published build, stable or
#      not, stays pinnable/referenceable later. From there the two actions
#      diverge on which floating tag(s) they also move:
#      - "released" only     -> points :latest at it, but only if this
#                             release is actually what GitHub currently
#                             considers the latest release (GET
#                             /repos/.../releases/latest) — not just "the
#                             most recently published one". A release
#                             published for an older branch, or with "Set
#                             as the latest release" unchecked, must not
#                             clobber :latest. :beta moves alongside it, in
#                             the same step, under the same gate — :beta is
#                             a superset of :latest (every real release
#                             :latest ever points at, :beta points at too),
#                             on top of every pre-release below. Also
#                             attaches docker-compose.yml to the release
#                             itself (a stable, versioned download URL, and
#                             a real number for the README's Downloads
#                             badge to count — GHCR has no public
#                             pull-count API, so a release asset is the
#                             closest thing to a live counter this setup
#                             can offer) — doesn't run for a pre-release,
#                             since that's part of the polished, stable
#                             distribution story, not the beta channel.
#      - "prereleased" only  -> points :beta at it — the other half of
#                             :beta's coverage, unconditionally (no
#                             latest-style check; every pre-release is, by
#                             definition, newer than the last one). :dev
#                             never moves on a release event either way —
#                             it's nightly-only now, driven off main's own
#                             validated commits, not releases (see #2
#                             above).
#   4. manual (workflow_dispatch)
#                          -> no build at all. Just re-checks
#                             releases/latest and re-points :latest at
#                             whichever version tag that now names — for
#                             "I changed which release is marked latest
#                             after the fact" without wanting to cut a
#                             whole new release to fix it.

name: Docker Publish

on:
  push:
    branches: [main]
  release:
    types: [released, prereleased]
  schedule:
    # Arbitrary off-the-hour time (GitHub's own recommendation — everyone
    # who schedules at a round hour spikes runner queue times right then).
    # UTC, no particular significance beyond "some time most maintainers
    # are asleep."
    - cron: '37 6 * * *'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  # actions: read is only for the nightly build's own "Resolve latest
  # validated commit on main" step (gh run list needs it to query this
  # workflow's own past runs) — every other job either doesn't need it or
  # already overrides permissions locally (attach-assets).
  actions: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # schedule-only — resolves which commit "nightly" actually means.
      # The schedule event itself has no ref tied to a specific validated
      # commit (it'd otherwise just check out main's current HEAD, which
      # might not have a successful validation run at all yet), so this
      # asks the GitHub API for this exact workflow's own most recent
      # successful push/main run and uses ITS commit instead.
      - name: Resolve latest validated commit on main
        if: github.event_name == 'schedule'
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(gh run list --repo "${{ github.repository }}" --workflow docker-publish.yml \
            --branch main --event push --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')
          if [ -z "$sha" ]; then
            echo "::error::No successful push-to-main validation run found — refusing to build an unvalidated commit."
            exit 1
          fi
          echo "Latest validated commit on main: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && steps.resolve.outputs.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'release' || github.event_name == 'schedule'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (validation only, no push)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false

      # Pushed by digest only (no final tag yet) — the merge/nightly job
      # below combines both architectures' digests into one multi-arch
      # manifest. This build-by-digest-then-merge two-step is Docker's own
      # documented pattern for multi-arch builds split across separate
      # native runners, as opposed to a single buildx invocation emulating
      # the other architecture under QEMU.
      - name: Build and push by digest
        if: github.event_name == 'release' || github.event_name == 'schedule'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name == 'release' || github.event_name == 'schedule'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'release' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Independent of build/merge — this is just a repo file, not the image —
  # so it runs in parallel rather than waiting on the (slower) multi-arch
  # build. Needs contents: write specifically (the top-level permissions
  # block only grants contents: read), so this job overrides it locally
  # rather than widening the token for every other job in the workflow.
  # Scoped to real releases only (github.event.action == 'released'), not
  # pre-releases — this is part of the polished, stable distribution story,
  # not something the beta channel needs.
  attach-assets:
    if: github.event_name == 'release' && github.event.action == 'released'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Attach docker-compose.yml to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never interpolate an event-derived value directly into a `run:`
          # script body — ${{ }} expansion happens at the templating layer,
          # before the shell parses anything, so a crafted tag name (git ref
          # names allow backticks, $(), quotes, etc.) would become literal
          # shell syntax rather than inert data. Routing it through env: and
          # referencing it as a normal shell variable defuses that; the
          # value is just a string to bash regardless of what it contains.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" docker-compose.yml --clobber

  merge:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version-tagged manifest
        working-directory: /tmp/digests
        env:
          # See "Attach docker-compose.yml to the release" above for why
          # this goes through env: rather than direct ${{ }} interpolation
          # in the script body.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:$RELEASE_TAG" \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      # :beta is a superset of :latest — every real release :latest ever
      # points at, :beta points at too (moved in the same step, same
      # GitHub-agrees-this-is-genuinely-latest gate, so the two never
      # disagree about a "released" event) — on top of every pre-release,
      # tagged separately below. A release for an older branch, or with
      # "Set as the latest release" unchecked, must not clobber either.
      - name: Point :latest and :beta at this release, if GitHub agrees it's the latest
        if: github.event.action == 'released'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          actual_latest=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          if [ "$actual_latest" = "$RELEASE_TAG" ]; then
            echo "GitHub's current latest release is $RELEASE_TAG — tagging :latest and :beta"
            docker buildx imagetools create \
              -t "${{ env.IMAGE }}:latest" \
              -t "${{ env.IMAGE }}:beta" \
              "${{ env.IMAGE }}:$RELEASE_TAG"
          else
            echo "GitHub's current latest release is $actual_latest, not $RELEASE_TAG — leaving :latest/:beta alone"
          fi

      # prereleased only — the other half of :beta's coverage (the above
      # step's "released" branch is the first half). :dev never moves here
      # at all (it's nightly-only now, driven off main's own validated
      # commits, not releases — see the "nightly" job below).
      - name: Point :beta at this pre-release
        if: github.event.action == 'prereleased'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "Tagging :beta at $RELEASE_TAG"
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:beta" \
            "${{ env.IMAGE }}:$RELEASE_TAG"

  # schedule only — takes the two digests build produced (from the latest
  # commit on main that build's own "Resolve latest validated commit on
  # main" step confirmed had a successful push-triggered validation run)
  # and points :dev straight at the merged manifest. No release-version tag
  # to create alongside it the way merge's release path does — a nightly
  # build isn't a pinnable release, :dev IS the pointer to it, and
  # tomorrow's nightly run simply moves it again.
  nightly:
    needs: build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :dev at tonight's build
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:dev" \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

  sync-latest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No rebuild — just re-points :latest at whichever version tag
      # GitHub currently considers the latest release. Cheap manifest copy,
      # not a rebuild (docker buildx imagetools create).
      - name: Re-point :latest at GitHub's current latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          echo "GitHub's current latest release is $tag"
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:$tag
